<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Traffic Tagger</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Highlight.js for JSON syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>HTTP Traffic Tagger</h1>
            <p>Analyze and explore tagged HTTP traffic</p>
        </header>
        
        <!-- Tab Navigation -->
        <nav class="tabs">
            <button class="tab-button active" data-tab="tagged-records">Tagged Records</button>
            <button class="tab-button" data-tab="raw-data">Raw Data Browser</button>
            <button class="tab-button" data-tab="correlation-timeline">Correlation Timeline</button>
        </nav>
        
        <!-- Tagged Records Tab Content -->
        <div id="tagged-records-tab" class="tab-content active">
            <div class="main-content">
                <!-- Left Column: Tag Filters -->
                <aside class="sidebar">
                    <h2>Filter by Tags</h2>
                    <div id="tags-container">
                        <p class="loading">Loading tags...</p>
                    </div>
                    <div class="filter-actions">
                        <button id="clear-filters" class="btn-secondary" title="Clear all records from database">Clear Database</button>
                    </div>
                </aside>
                
                <!-- Right Column: Records List -->
                <main class="content">
                    <div class="content-header">
                        <h2>Records</h2>
                        <div id="selected-tags" class="selected-tags"></div>
                    </div>
                    
                    <div id="records-container">
                        <p class="info">Select tags to filter records</p>
                    </div>
                </main>
            </div>
        </div>
        
        <!-- Raw Data Browser Tab Content -->
        <div id="raw-data-tab" class="tab-content">
            <div class="raw-data-browser">
                <!-- Filters -->
                <div class="raw-data-filters">
                    <div class="filter-group">
                        <label for="source-filter">Source:</label>
                        <select id="source-filter">
                            <option value="csv">CSV Records</option>
                            <option value="sidecar">Sidecar Events</option>
                        </select>
                    </div>
                    
                    <div class="filter-group" id="category-filter-group" style="display: none;">
                        <label for="category-filter">Category:</label>
                        <select id="category-filter">
                            <option value="">All Categories</option>
                            <option value="dom_snapshots">DOM Snapshots</option>
                            <option value="js_executions">JS Executions</option>
                            <option value="storage_states">Storage States</option>
                        </select>
                    </div>
                    
                    <button id="apply-filters" class="btn-primary">Apply Filters</button>
                </div>
                
                <!-- Records List -->
                <div id="raw-records-container">
                    <p class="info">Loading records...</p>
                </div>
                
                <!-- Pagination -->
                <div id="raw-pagination" class="pagination" style="display: none;">
                    <button id="prev-page" class="btn-secondary">Previous</button>
                    <span id="page-info">Page 1 of 1</span>
                    <button id="next-page" class="btn-secondary">Next</button>
                </div>
            </div>
        </div>
        
        <!-- Correlation Timeline Tab Content -->
        <div id="correlation-timeline-tab" class="tab-content">
            <div class="timeline-header">
                <h2>Correlation Timeline</h2>
                <div class="timeline-stats" id="timeline-stats">
                    <span class="stat">Loading statistics...</span>
                </div>
            </div>
            
            <!-- Timeline Filters -->
            <div class="timeline-filters">
                <div class="filter-group">
                    <label for="url-filter-timeline">Filter URL:</label>
                    <input type="text" id="url-filter-timeline" placeholder="e.g., /api/users">
                </div>
                <button id="apply-timeline-filters" class="btn-primary">Apply Filter</button>
                <button id="clear-timeline-filters" class="btn-secondary">Clear</button>
            </div>
            
            <!-- Timeline Content -->
            <div id="timeline-container" class="timeline-container">
                <p class="info">Loading timeline...</p>
            </div>
            
            <!-- Timeline Pagination -->
            <div id="timeline-pagination" class="pagination" style="display: none;">
                <button id="timeline-prev-page" class="btn-secondary">Previous</button>
                <span id="timeline-page-info">Page 1 of 1</span>
                <button id="timeline-next-page" class="btn-secondary">Next</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
    <script src="raw-data-browser.js"></script>
    <script src="correlation-timeline.js"></script>
</body>
</html>
