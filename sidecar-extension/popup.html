<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidecar Control</title>
  <style>
    body {
      width: 350px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      color: white;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
    }

    .content {
      padding: 20px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
    }

    .status-dot.connected {
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
    }

    .status-dot.monitoring {
      background: #3b82f6;
      box-shadow: 0 0 10px #3b82f6;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    button.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button.secondary {
      background: #2a2a2a;
      color: #e0e0e0;
    }

    button.secondary:hover {
      background: #3a3a3a;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .info-box {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .info-box h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #a0a0a0;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }

    .stat:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: #a0a0a0;
      font-size: 13px;
    }

    .stat-value {
      color: #e0e0e0;
      font-weight: 500;
      font-size: 13px;
    }

    .footer {
      padding: 15px 20px;
      background: #2a2a2a;
      text-align: center;
      font-size: 11px;
      color: #666;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 Sidecar</h1>
    <p>Security Analysis Assistant</p>
  </div>

  <div class="content">
    <!-- Backend Connection Status -->
    <div class="status">
      <div class="status-indicator">
        <div class="status-dot" id="backendStatus"></div>
        <span id="backendStatusText">Connecting to backend...</span>
      </div>
    </div>

    <!-- Tab Monitoring Status -->
    <div class="status">
      <div class="status-indicator">
        <div class="status-dot" id="monitoringStatus"></div>
        <span id="monitoringStatusText">Not monitoring</span>
      </div>
    </div>

    <!-- Control Buttons -->
    <div class="button-group">
      <button id="startBtn" class="primary">Start Monitoring</button>
      <button id="stopBtn" class="secondary" disabled>Stop</button>
    </div>

    <button id="openConsoleBtn" class="secondary" style="width: 100%; margin-bottom: 15px;">
      Open Attack Console
    </button>

    <!-- Log Management -->
    <div class="button-group">
      <button id="downloadLogsBtn" class="secondary">Download Logs</button>
      <button id="clearLogsBtn" class="secondary">Clear Logs</button>
    </div>

    <!-- Statistics -->
    <div class="info-box">
      <h3>CURRENT SESSION</h3>
      <div class="stat">
        <span class="stat-label">Events Captured</span>
        <span class="stat-value" id="eventCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Active Tab</span>
        <span class="stat-value" id="activeTab">None</span>
      </div>
    </div>
  </div>

  <div class="footer">
    v1.0.0 | <a href="settings.html" id="settingsLink" target="_blank">Settings</a> |
    <a href="https://github.com/yourusername/sidecar" target="_blank">Docs</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
