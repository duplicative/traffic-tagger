version: '3.8'

services:
  database:
    image: mongo:5.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}

  api:
    build:
      context: ./api
    container_name: api_server
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    env_file:
      - ./.env
    depends_on:
      - database

  frontend:
    image: nginx:latest
    container_name: frontend_server
    ports:
      - "8080:80"
    volumes:
      - ./frontend/static:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

  cli:
    build:
      context: ./cli
    volumes:
      - ./data:/data
    env_file:
      - ./.env
    depends_on:
      - database
    command: ["ingest"]

volumes:
  mongodb_data:
