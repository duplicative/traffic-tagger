version: '3.8'

services:
  database:
    image: mongo:5.0
    container_name: traffic_tagger_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - tagger_network
    ports:
      - "27017:27017"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: traffic_tagger_api
    environment:
      MONGO_URI: ${MONGO_URI}
    depends_on:
      - database
    networks:
      - tagger_network
    ports:
      - "${API_PORT}:8000"

  frontend:
    image: nginx:alpine
    container_name: traffic_tagger_frontend
    volumes:
      - ./frontend/static:/usr/share/nginx/html:ro
      - ./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - tagger_network
    ports:
      - "${FRONTEND_PORT}:80"

  cli:
    build:
      context: .
      dockerfile: cli/Dockerfile
    container_name: traffic_tagger_cli
    environment:
      MONGO_URI: ${MONGO_URI}
    volumes:
      - ./data:/data
    networks:
      - tagger_network
    profiles:
      - cli
    depends_on:
      - database

networks:
  tagger_network:
    driver: bridge

volumes:
  mongo_data:
