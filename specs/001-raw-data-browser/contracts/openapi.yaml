openapi: 3.0.0
info:
  title: HTTP Traffic Tagger API
  version: 1.0.0
paths:
  /api/raw-records:
    get:
      summary: Get raw records from the database
      parameters:
        - name: source
          in: query
          description: Filter by record source (csv or sidecar)
          schema:
            type: string
            enum: [csv, sidecar]
        - name: category
          in: query
          description: Filter by sidecar record category
          schema:
            type: string
            enum: [dom_snapshots, js_executions, storage_states]
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Number of records per page
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: A list of raw records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                  total_pages:
                    type: integer
                  current_page:
                    type: integer
